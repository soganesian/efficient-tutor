[project]
name = "kurator"
version = "0.1.0"
description = "Telegram bot for supervising a child's tutoring cycle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "SQLAlchemy>=2.0,<2.1",
    "APScheduler>=3.10,<4",
    "anthropic>=0.40",
    "google-genai>=2.18",
    "gspread>=6.1",
    "google-auth>=2.34",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kurator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
